name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: ./.github/actions/dev-shell
      - name: Install frontend dependencies
        run: nix develop -c bash -c 'cd frontend && bun install --frozen-lockfile'
      - name: Run every check
        run: nix develop -c knave task ci
